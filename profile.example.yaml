# profile.yaml — EXEMPLO / template.
# Copie para profile.yaml e preencha com os seus dados (ou use "Perfil > Preencher com IA").
# Seções instrucionais (level_definitions, classification_rules, matching_guidance,
# title_matching, skill_aliases, skill_groups) já vêm preenchidas como padrão; ajuste ao seu caso.
profile_version: 2
source_of_truth: true
level_definitions:
  hands_on: Experiência prática profissional comprovada ou informada diretamente pelo
    usuário.
  working_knowledge: Conhecimento funcional com alguma prática, sem evidência de experiência
    profissional sólida ou autonomia plena.
  learning: Tecnologia ou competência em estudo.
  conceptual: Conhecimento conceitual sem prática suficiente para execução independente.
  none: Sem evidência suficiente de conhecimento ou experiência; não afirma ausência
    definitiva.
source_definitions:
  cv: Extraído do currículo.
  user: Confirmado diretamente pelo usuário.
  project: Identificado em código ou arquivos do CareerOps.
status_definitions:
  confirmed: Baseado em evidência disponível.
  not_assessed: Sem evidência confirmada; competência não avaliada.
classification_rules:
- Nunca elevar automaticamente learning -> working_knowledge -> hands_on.
- Curso, certificação ou laboratório não implica experiência prática.
- Ausência no currículo não implica ausência de experiência profissional.
- Não atribuir origem documental (cv) a experiência informada somente pelo usuário.
identity:
  name: Seu Nome
  location_key: ''
  linkedin_public: false
  github_public: false
professional_objective: 'Descreva em 2-4 linhas o que busca (cargo, área e objetivo).'
target_roles:
  primary: []
  adjacent: []
  also_acceptable: ''
seniority:
  target: ''
  current:
    it_total_years: 0
    infrastructure_focus_years: 0
  open_to_levels: []
  evaluation_rule: Classificar por experiência efetiva, responsabilidades, autonomia
    e requisitos da vaga; nunca apenas pelo título.
